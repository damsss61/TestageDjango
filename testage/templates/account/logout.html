{% extends "base.html" %}
{% load static %}

{% block content %}
<!-- Modal de déconnexion -->
<div class="modal fade show" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-modal="true" role="dialog" style="display: block;">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="logoutModalLabel">Déconnexion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="window.location.href={% url 'accueil' %}"></button>
      </div>
      <div class="modal-body">
        Tu as été déconnecté avec succès.
      </div>
      <div class="modal-footer">
        <a href="{% url 'account_login' %}" class="btn btn-primary">Se reconnecter</a>
        <button type="button" class="btn btn-secondary" onclick="window.location.href='{% url 'accueil' %}'">Retour à l'accueil</button>
      </div>
    </div>
  </div>
</div>

<!-- Arrière-plan flouté pour le modal -->
<div class="modal-backdrop fade show"></div>

<style>
  .modal {
    z-index: 1060;
  }
  .modal-backdrop {
    z-index: 1050;
  }
</style>

<script>
  // Fermer le modal en cliquant à l'extérieur
  document.querySelector('.modal').addEventListener('click', function(e) {
    if (e.target === this) {
      window.location.href = '{% url 'accueil' %}';
    }
  });
</script>
{% endblock %}
