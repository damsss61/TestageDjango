{% extends "base.html" %}

{% block title %}Déjà voté - {{ resolution.title }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow text-center">
                <div class="card-body">
                    <i class="bi bi-exclamation-circle text-warning" style="font-size: 4rem; margin-bottom: 1rem;"></i>
                    <h4 class="card-title">Vous avez déjà voté pour cette résolution.</h4>
                    <p class="card-text">Chaque utilisateur ne peut voter qu'une seule fois.</p>
                    <div class="d-grid gap-2 mt-4">
                        <a href="{% url 'resolution_details' resolution.id %}" class="btn btn-primary">
                            Retour à la résolution
                        </a>
                        <a href="{% url 'accueil' %}" class="btn btn-outline-secondary">
                            Retour à l'accueil
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
