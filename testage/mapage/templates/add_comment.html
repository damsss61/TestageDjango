{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Ajouter un commentaire - {{ resolution.title }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Ajouter un commentaire</h2>
                    <h5 class="text-center mb-4">{{ resolution.title }}</h5>
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">Publier le commentaire</button>
                            <a href="{% url 'resolution_details' resolution.id %}" class="btn btn-secondary">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
